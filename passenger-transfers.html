<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <title>التحويلات | دَرْب</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="passenger-transfers" class="app-shell">
  <div data-site-nav></div>
  <div class="demo-banner" data-demo-banner></div>
  <main class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <h1>التحويلات</h1>
          <p class="muted">أكد إكمال الرحلات وابحث عن سائق لتحويل النقاط إليه.</p>
        </div>
      </div>
      <section id="passengerPointsMount" class="card passenger-points" data-points-view="transfers" aria-labelledby="passengerTransfersTitle">
        <div class="section-head">
          <div>
            <h2 id="passengerTransfersTitle">تأكيد إكمال الرحلات</h2>
            <p class="muted">رصيدك القابل للتحويل: <strong data-passenger-points-balance>—</strong></p>
          </div>
        </div>
        <p class="muted" data-passenger-points-policy role="status">جارٍ تحميل إعدادات التحويل...</p>
        <div class="passenger-completion-history">
          <div class="list" data-passenger-completion-list><p class="muted">جارٍ تحميل الحجوزات...</p></div>
        </div>
        <form class="passenger-driver-search" data-driver-search-form>
          <label for="transferDriverQuery">ابحث عن السائق بالاسم أو اسم المستخدم</label>
          <div class="actions">
            <input id="transferDriverQuery" name="query" minlength="2" maxlength="80" required autocomplete="off">
            <button class="btn btn-outline" type="submit">بحث عن سائق</button>
          </div>
        </form>
        <div class="passenger-driver-results" data-driver-search-results aria-live="polite"></div>
        <form class="passenger-points-transfer hidden" data-points-transfer-form>
          <p data-transfer-recipient></p>
          <div class="field">
            <label for="transferPointsAmount">عدد النقاط</label>
            <input id="transferPointsAmount" name="points" type="number" min="10" step="10" required>
            <small>يجب أن يكون المبلغ من مضاعفات 10 نقاط.</small>
          </div>
          <label class="passenger-transfer-confirm">
            <input name="confirm" type="checkbox" required>
            أؤكد تحويل النقاط المحددة إلى هذا السائق. لا يمكن التراجع عن التحويل.
          </label>
          <div class="actions">
            <button class="btn btn-primary" type="submit">تأكيد التحويل</button>
            <button class="btn btn-outline" type="button" data-clear-recipient>إلغاء</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script src="js/script.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/passenger-points.js"></script>
</body>
</html>
